<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="You and Fit">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#08080A">
<link rel="manifest" href="manifest.webmanifest">
<title>You and Fit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --ink:#08080A; --panel:#131318; --panel2:#1B1B22; --panel3:#24242E;
  --line:#2D2D38; --line2:#3A3A47;
  --red:#E31B23; --red-hi:#FF3A32; --red-deep:#8C0D12; --red-soft:rgba(227,27,35,.14);
  --text:#F4F4F6; --muted:#9A9AA6; --muted2:#6E6E7C;
  --ok:#3FD07A; --warn:#F5A623;
  --r:14px; --rs:10px;
  --disp:'Oswald','Arial Narrow',Impact,sans-serif;
  --body:'Barlow','Helvetica Neue',Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ink);color:var(--text);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none}
:focus-visible{outline:2px solid var(--red-hi);outline-offset:2px}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;margin:0;letter-spacing:.02em;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;background:var(--ink);position:relative}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:10px;
  padding:10px 16px;background:linear-gradient(180deg,#170405 0%,#0C0C0F 100%);border-bottom:1px solid var(--line)}
.topbar .logo{width:38px;height:38px;flex:0 0 auto}
.topbar .wordmark{font-family:var(--disp);font-size:19px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;line-height:1}
.topbar .wordmark b{color:var(--red-hi);font-weight:600}
.topbar .sub{font-size:10px;letter-spacing:.28em;color:var(--muted2);text-transform:uppercase;margin-top:2px}
.topbar .spacer{flex:1}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--muted);border:1px solid transparent}
.iconbtn:hover{background:var(--panel2);color:var(--text)}
.backbtn{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:14px;padding:4px 6px 4px 0}
.backbtn:hover{color:var(--text)}
.backbtn[hidden],#topTitle[hidden],.logo[hidden],.memline[hidden]{display:none}

main{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 16px 26px;display:flex;flex-direction:column;gap:14px}
.view{display:flex;flex-direction:column;gap:14px}

.tabbar{position:sticky;bottom:0;z-index:40;display:grid;grid-template-columns:repeat(5,1fr);
  background:#0C0C10;border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;color:var(--muted2);font-size:10px;letter-spacing:.06em;text-transform:uppercase;border-radius:10px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--red-hi)}
.tabbar button[aria-selected="true"] svg{filter:drop-shadow(0 0 6px rgba(227,27,35,.5))}

.demobadge{display:inline-block;background:var(--warn);color:#1a1200;font-weight:800;
  font-size:9px;letter-spacing:.18em;padding:2px 7px;border-radius:4px;margin-left:6px;vertical-align:2px}
.optcard{display:block;width:100%;text-align:left;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--r);padding:12px 13px}
.optcard b{display:block;font-size:14.5px;font-weight:600;margin-bottom:4px;color:var(--text)}
.optcard span{display:block;font-size:12.5px;color:var(--muted);line-height:1.45}
.optcard.on{border-color:var(--red);background:var(--red-soft)}
.optcard.on b{color:var(--red-hi)}

#gate[hidden]{display:none}
#gate{position:fixed;inset:0;z-index:999;background:var(--bg);display:flex;
  align-items:center;justify-content:center;padding:24px;overflow:auto}
.gatebox{max-width:430px;text-align:center}
.gatelogo{display:flex;justify-content:center;margin-bottom:18px}
.gatebox h1{font-family:var(--disp);font-size:34px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.gatebox h1 b{color:var(--red-hi)}
.gatebox p{color:var(--muted);font-size:14.5px;line-height:1.6;margin-bottom:18px}
.gatebox p.tiny{font-size:12.5px;margin-top:16px;margin-bottom:0}
.gatebtn{font-size:17px;padding:16px;text-decoration:none;display:block}
.gatelink{display:flex;gap:8px;margin-top:16px}
.gatelink input{flex:1;min-width:0;background:#15151C;border:1px solid var(--line);border-radius:10px;
  color:var(--muted);font-size:11.5px;padding:10px;font-family:inherit}
.gatesteps{text-align:left;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);padding:14px 16px;margin-top:4px}
.gateskip{display:block;width:100%;margin-top:22px;background:none;border:0;color:var(--muted2);
  font-size:13px;text-decoration:underline;font-family:inherit;padding:8px}
.passi{margin:4px 0 0 18px;padding:0;color:var(--muted);font-size:13px;line-height:1.75}
.passi li{margin-bottom:4px}
.passi b{color:var(--text)}
.memline{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;
  padding:7px 16px;font-size:12px;line-height:1.3;background:#121218;color:var(--muted);
  border-bottom:1px solid var(--line);font-family:inherit}
.memline .dot{width:9px;height:9px;border-radius:50%;background:var(--muted2);flex:none}
.memline.ok .dot{background:var(--ok)}
.memline.ok{color:var(--muted)}
.memline.work .dot{background:var(--warn);animation:pulsa 1s infinite}
.memline.bad{background:#2A1416;color:#FFC9C9}
.memline.bad .dot{background:var(--red-hi)}
.memline .az{margin-left:auto;color:var(--red-hi);font-weight:600;text-decoration:underline}
@keyframes pulsa{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- blocks ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card.flat{background:var(--panel);border-color:var(--line)}
.card h3{font-size:16px;letter-spacing:.04em;text-transform:uppercase}
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--muted2);font-weight:600}
.muted{color:var(--muted)}
.tiny{font-size:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.sep{height:1px;background:var(--line);margin:4px 0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 16px;border-radius:999px;
  font-family:var(--disp);font-size:15px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;
  background:var(--red);color:#fff;border:1px solid var(--red);transition:filter .15s,transform .05s}
.btn:hover{filter:brightness(1.12)} .btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--red-hi);border-color:var(--red)}
.btn.soft{background:var(--panel3);color:var(--text);border-color:var(--line2)}
.btn.sm{padding:7px 13px;font-size:13px}
.btn.block{width:100%}
.btn[disabled]{opacity:.4;pointer-events:none}
.chip{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:4px 10px;border-radius:999px;background:var(--panel3);
  border:1px solid var(--line2);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.chip.red{background:var(--red-soft);border-color:rgba(227,27,35,.4);color:var(--red-hi)}
.chip.ok{background:rgba(63,208,122,.12);border-color:rgba(63,208,122,.35);color:var(--ok)}

label.fld{display:flex;flex-direction:column;gap:5px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);font-weight:600;flex:1;min-width:0}
input,select,textarea{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rs);padding:10px 11px;
  color:var(--text);font-size:15px;width:100%;letter-spacing:0;text-transform:none;font-weight:400}
input:focus,select,textarea:focus{border-color:var(--line2)}
textarea{min-height:64px;resize:vertical}
input[type=number]{font-variant-numeric:tabular-nums}
select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);
  background-position:calc(100% - 17px) 18px,calc(100% - 12px) 18px;background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:32px}

/* ---------- home ---------- */
.hero{background:radial-gradient(120% 90% at 100% 0%,rgba(227,27,35,.22) 0%,transparent 60%),var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:16px}
.bignum{font-family:var(--disp);font-size:46px;line-height:.9;font-weight:600;color:var(--red-hi)}
.bignum small{font-size:20px;color:var(--text);font-weight:400}
.meter{height:7px;border-radius:99px;background:var(--panel3);overflow:hidden}
.meter i{display:block;height:100%;background:linear-gradient(90deg,var(--red-deep),var(--red-hi));border-radius:99px}
.navcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:14px}
.navcard:hover{border-color:var(--line2)}
.navcard .ic{width:34px;height:34px;border-radius:9px;background:var(--red-soft);display:grid;place-items:center;color:var(--red-hi);flex:0 0 auto}
.navcard .ic svg{width:19px;height:19px}
.navcard .arrow{color:var(--muted2)}

/* ---------- lists ---------- */
.exrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}
.exrow:hover{border-color:var(--line2)}
.exrow .idx{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--red);color:var(--red-hi);
  display:grid;place-items:center;font-family:var(--disp);font-size:14px;flex:0 0 auto}
.exrow.done .idx{background:var(--red);color:#fff}
.exrow .nm{font-weight:600;font-size:14.5px;line-height:1.25}
.exrow .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-top:2px}
.weekhead{display:flex;align-items:center;gap:10px;margin-top:4px}
.weekhead h4{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.weekhead .ln{flex:1;height:1px;background:var(--line)}
.daycard{display:flex;align-items:center;gap:11px;width:100%;text-align:left;background:var(--panel);
  border:1px solid var(--line);border-left:3px solid var(--line2);border-radius:var(--rs);padding:10px 12px}
.daycard.done{border-left-color:var(--ok)}
.daycard.next{border-left-color:var(--red);background:linear-gradient(90deg,rgba(227,27,35,.1),transparent 60%)}
.daycard .d{font-family:var(--disp);font-size:12px;color:var(--muted2);letter-spacing:.12em;width:44px;flex:0 0 auto}
.daycard .t{font-weight:600;font-size:14.5px}

/* ---------- execution ---------- */
.exhead{background:linear-gradient(160deg,rgba(227,27,35,.18),transparent 70%),var(--panel);
  border:1px solid var(--line);border-radius:var(--r);padding:16px}
.exhead h2{font-size:23px;line-height:1.1;text-transform:uppercase}
.statgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.statgrid div{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rs);padding:9px 6px;text-align:center}
.statgrid b{display:block;font-family:var(--disp);font-size:21px;color:var(--red-hi);line-height:1}
.statgrid span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.setgrid{display:grid;grid-template-columns:34px 1fr 1fr 42px;gap:8px;align-items:center}
.setgrid .hd{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);text-align:center;font-weight:600}
.setno{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--red);color:var(--red-hi);display:grid;place-items:center;font-family:var(--disp);font-size:13px}
.setdone .setno{background:var(--red);color:#fff;border-color:var(--red)}
.setdone input{opacity:.55}
.tick{width:36px;height:36px;border-radius:10px;border:1px solid var(--line2);background:var(--panel2);display:grid;place-items:center;color:var(--muted)}
.setdone .tick{background:var(--red);border-color:var(--red);color:#fff}
.execnav{display:flex;align-items:center;gap:10px;position:sticky;bottom:0;background:var(--ink);
  padding:10px 0 6px;box-shadow:0 -12px 18px 6px var(--ink)}
.view.exec{padding-bottom:70px}
.pagecount{font-family:var(--disp);font-size:15px;color:var(--muted);min-width:44px;text-align:center}

/* rest timer */
.resttimer{position:fixed;left:0;right:0;bottom:0;z-index:60;background:#120306;border-top:2px solid var(--red);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));max-width:560px;margin:0 auto;
  box-shadow:0 -14px 40px rgba(0,0,0,.75);transform:translateY(105%);transition:transform .22s ease}
.resttimer.on{transform:none}
.resttimer .cd{font-family:var(--disp);font-size:56px;line-height:.9;color:var(--red-hi);letter-spacing:.02em;
  transition:color .2s}
.resttimer .nextlab{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.25}
.resttimer .bar{height:5px;border-radius:99px;background:#2A0A0D;overflow:hidden;margin-top:9px}
.resttimer .bar i{display:block;height:100%;background:var(--red-hi);transition:width .25s linear,background .2s}
/* ultimi 10 secondi */
.resttimer.warn{background:#1A0405;border-top-color:var(--warn)}
.resttimer.warn .cd{color:var(--warn);animation:pulse 1s ease-in-out infinite}
.resttimer.warn .bar i{background:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.45}}
/* fine recupero */
.resttimer.go{background:#04140A;border-top-color:var(--ok)}
.resttimer.go .cd{color:var(--ok)}
.resttimer.go .bar i{background:var(--ok)}
.gobox{display:flex;align-items:center;gap:12px}
.gobox .big{font-family:var(--disp);font-size:30px;line-height:1.05;color:var(--ok);letter-spacing:.05em}
.restmini{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--line);
  border-radius:var(--rs);padding:8px 10px;margin-top:10px}
.restmini .lab{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2);font-weight:600}
.switch{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:14px;color:var(--text);
  text-transform:none;letter-spacing:0;font-weight:400}
.switch input{width:auto;margin:0;accent-color:var(--red)}

/* ---------- nutrition ---------- */
.segmented{display:flex;gap:4px;background:var(--panel2);border:1px solid var(--line);border-radius:999px;padding:4px}
.segmented button{flex:1;padding:8px 6px;border-radius:999px;font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--muted)}
.segmented button[aria-selected="true"]{background:var(--red);color:#fff}
.macrorow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.macrobox{background:var(--panel2);border:1px solid var(--line);border-radius:var(--rs);padding:10px;text-align:center}
.macrobox b{display:block;font-family:var(--disp);font-size:22px;line-height:1}
.macrobox span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
.macrobox.c b{color:#5AB7F0}.macrobox.p b{color:#F0A35A}.macrobox.f b{color:var(--red-hi)}
.mealcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.mealcard>header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 13px;background:var(--panel2);border-bottom:1px solid var(--line)}
.mealcard>header h4{font-size:13px;letter-spacing:.16em;text-transform:uppercase;line-height:1.3}
.fooditem{padding:11px 13px;border-bottom:1px solid var(--line)}
.fooditem:last-child{border-bottom:none}
.itrow{display:flex;align-items:baseline;gap:10px}
.itrow .nm{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.25}
.itrow .g{font-family:var(--disp);font-size:17px;color:var(--red-hi);white-space:nowrap}
.itrow .sw{width:28px;height:28px;flex:0 0 auto;border-radius:8px;border:1px solid var(--line2);
  background:var(--panel2);color:var(--muted);font-size:14px;line-height:1;align-self:center}
.itrow .sw:hover{color:var(--red-hi);border-color:rgba(227,27,35,.45)}
.itmacros{font-size:11.5px;color:var(--muted2);margin-top:2px;padding-right:76px}
.italt{display:flex;align-items:baseline;gap:6px;margin-top:4px;font-size:13px;color:var(--muted);padding-right:38px}
.italt .o{color:var(--red-hi);font-weight:600;font-size:12.5px}
.italt .nm{flex:1;min-width:0;line-height:1.25}
.italt .g{white-space:nowrap;font-weight:600;color:var(--text)}
.foodrow{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}
.star{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--muted2);border:1px solid var(--line)}
.star.on{color:var(--red-hi);border-color:rgba(227,27,35,.45);background:var(--red-soft)}
.planline{display:flex;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px dashed var(--line)}
.planline .g{color:var(--red-hi);white-space:nowrap;font-variant-numeric:tabular-nums}
.planline.note{color:var(--muted2);font-size:12px;font-style:italic;border-bottom:none}

.coachnota{font-size:12.5px;color:var(--muted2);font-style:italic;line-height:1.5}
.varbtn{margin-top:8px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
  font-weight:600;border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--panel2)}
.varbtn[aria-expanded="true"]{color:var(--red-hi);border-color:rgba(227,27,35,.4);background:var(--red-soft)}
.varbox{margin-top:8px;padding:8px 10px;border-left:2px solid var(--line2);background:var(--panel2);border-radius:0 8px 8px 0}
.varbox .o{color:var(--muted2);font-size:10px;letter-spacing:.12em;text-transform:uppercase}

/* ---------- stats ---------- */
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi>div{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi b{display:block;font-family:var(--disp);font-size:27px;line-height:1;color:var(--text)}
.kpi b.red{color:var(--red-hi)}
.kpi span{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted2)}
svg.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}


/* ---------- guida esercizio ---------- */
.pillrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:7px;text-decoration:none;padding:9px 15px;border-radius:999px;
  background:var(--red-soft);border:1px solid rgba(227,27,35,.38);color:var(--red-hi);
  font-size:14px;font-weight:600;letter-spacing:.01em}
.pill:hover{background:rgba(227,27,35,.22)}
.pill[aria-expanded="true"]{background:var(--red);border-color:var(--red);color:#fff}
.pill svg{width:15px;height:15px}
.medbox{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel2)}
.exfoto{display:block;width:100%;max-height:300px;object-fit:cover}
.bodywrap{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px}
.bodywrap figure{margin:0;text-align:center}
.bodywrap figcaption{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted2);margin-top:4px}
.bodymap{width:100%;max-width:130px;height:auto;display:block;margin:0 auto}
.guida .lab{display:block;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--red-hi);font-weight:600;margin-bottom:3px}
.guida p{margin:0 0 10px;font-size:14px;line-height:1.5;color:var(--text)}
.guida.err .lab{color:var(--warn)}
.guida.err p{color:var(--muted)}
.muscchips{display:flex;gap:6px;flex-wrap:wrap;padding:0 10px 10px}

.kcalbox{display:flex;align-items:center;gap:12px;background:linear-gradient(90deg,rgba(227,27,35,.16),transparent);
  border:1px solid rgba(227,27,35,.35);border-radius:var(--r);padding:12px 14px}
.kcalbig{font-family:var(--disp);font-size:32px;line-height:1;color:var(--red-hi);white-space:nowrap}

/* ---------- modal ---------- */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:var(--panel);border:1px solid var(--line2);border-radius:18px 18px 0 0;width:100%;max-width:560px;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:86px;z-index:90;background:var(--panel3);
  border:1px solid var(--line2);border-radius:999px;padding:9px 16px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.6)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

function iso(d){ return new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10); }
function fmtOraData(ms){ const d=new Date(ms), p=n=>('0'+n).slice(-2);
  const oggi=iso(new Date())===iso(d);
  return (oggi?'oggi':p(d.getDate())+'/'+p(d.getMonth()+1))+' alle '+p(d.getHours())+':'+p(d.getMinutes()); }
function fmtData(s){ const d=new Date(s+'T00:00:00'); return GG[d.getDay()]+' '+d.getDate()+'/'+(d.getMonth()+1); }

function buildProgramma(schedaId, inizioIso, settimane, offsets, db){
  const sc=(db||DB).schede.find(s=>s.id===schedaId)||(db||DB).schede[0];
  const blocchi=sc.giorni; const sedute=[]; let k=0;
  const start=new Date(inizioIso+'T00:00:00');
  for(let w=0;w<settimane;w++){
    for(let i=0;i<offsets.length;i++){
      const dt=new Date(start); dt.setDate(start.getDate()+w*7+offsets[i]);
      const b=blocchi[k%blocchi.length];
      sedute.push({id:'sd'+w+'_'+i, sett:w+1, n:k+1, data:iso(dt), schedaId:sc.id, blocco:b.nome, bloccoIdx:blocchi.indexOf(b)});
      k++;
    }
  }
  return {schedaId:sc.id, inizio:inizioIso, settimane, offsets, sedute};
}

/* ---------- rest timer ---------- */
function IMP(){ return (DB && DB.impostazioni) || {suono:true,vibra:true,preavviso:true,autoRest:true}; }
const TITLE='You and Fit';

/* Il telefono congela i timer quando lo schermo si spegne o cambi app.
   Per questo l'audio non viene "suonato al momento giusto" ma preparato
   in anticipo come una traccia: silenzio, poi i bip nei punti esatti.
   La traccia continua anche a schermo spento, come fa la musica. */
function wavSegnali(sec, conPreavviso){
  const SR=8000, coda=3, n=Math.ceil((sec+coda)*SR);
  const d=new Uint8Array(44+n); 
  const w=(off,str)=>{ for(let i=0;i<str.length;i++) d[off+i]=str.charCodeAt(i); };
  const w32=(off,v)=>{ d[off]=v&255; d[off+1]=(v>>8)&255; d[off+2]=(v>>16)&255; d[off+3]=(v>>24)&255; };
  const w16=(off,v)=>{ d[off]=v&255; d[off+1]=(v>>8)&255; };
  w(0,'RIFF'); w32(4,36+n); w(8,'WAVE'); w(12,'fmt '); w32(16,16); w16(20,1); w16(22,1);
  w32(24,SR); w32(28,SR); w16(32,1); w16(34,8); w(36,'data'); w32(40,n);
  for(let i=0;i<n;i++) d[44+i]=128;
  const tono=(t0,dur,freq)=>{
    const s0=Math.floor(t0*SR), s1=Math.min(n,Math.floor((t0+dur)*SR));
    for(let i=s0;i<s1;i++){
      if(i<0) continue;
      const env=Math.min(1,(i-s0)/120,(s1-i)/120);
      d[44+i]=128+Math.round(Math.sin(2*Math.PI*freq*(i-s0)/SR)*118*env);
    }
  };
  if(conPreavviso){
    if(sec>12) tono(sec-10,.16,660);
    [3,2,1].forEach(k=>{ if(sec>k+1) tono(sec-k,.10,780); });
  }
  [0,.30,.60,.95].forEach((o,i)=>tono(sec+o,.24,i===3?1180:940));
  return URL.createObjectURL(new Blob([d],{type:'audio/wav'}));
}

const Rest={
  end:0, total:0, iv:null, next:'', ticked:{}, audio:null, url:null, scaduto:false,
  start(sec, next){
    if(!(sec>0)) sec=60;
    this.stopAudio();
    this.total=sec; this.end=Date.now()+sec*1000; this.next=next||'';
    this.ticked={}; this.scaduto=false;
    const el=$('#restTimer'); el.classList.remove('go','warn'); el.classList.add('on');
    $('#restRunning').hidden=false; $('#restGo').hidden=true;
    $('#restNext').textContent=this.next;
    const mm=$('#main'); if(mm) mm.style.paddingBottom='190px';
    unlockAudio();
    if(modoAudio()==='sveglia') this.playTraccia(sec);
    wakeOn();
    this.tick(); clearInterval(this.iv); this.iv=setInterval(()=>this.tick(),200);
  },
  playTraccia(sec){
    if(!IMP().suono) return;
    try{
      this.url=wavSegnali(sec, !!IMP().preavviso);
      this.audio=new Audio(this.url);
      this.audio.preload='auto';
      const pr=this.audio.play();
      if(pr && pr.catch) pr.catch(()=>{ this.audio=null; unlockAudio(); });
    }catch(e){ this.audio=null; }
  },
  stopAudio(){
    try{ if(this.audio){ this.audio.pause(); this.audio.src=''; } }catch(e){}
    try{ if(this.url) URL.revokeObjectURL(this.url); }catch(e){}
    this.audio=null; this.url=null;
  },
  add(s){
    if(!this.end) return;
    const resto=Math.max(5, Math.ceil((this.end-Date.now())/1000)+s);
    this.start(resto, this.next);
    this.total=Math.max(this.total, resto);
  },
  stop(){
    clearInterval(this.iv); this.iv=null; this.end=0; this.scaduto=false; this.stopAudio();
    const el=$('#restTimer'); el.classList.remove('on','warn','go');
    $('#restRunning').hidden=false; $('#restGo').hidden=true;
    const mm=$('#main'); if(mm) mm.style.paddingBottom='';
    document.title=TITLE;
  },
  tick(){
    if(this.scaduto) return;
    const left=Math.max(0,Math.ceil((this.end-Date.now())/1000));
    const txt=Math.floor(left/60)+':'+String(left%60).padStart(2,'0');
    $('#restCd').textContent=txt;
    $('#restBar').style.width=(this.total? clamp(left/this.total*100,0,100):0)+'%';
    document.title = left>0 ? '⏱ '+txt+' · You and Fit' : TITLE;
    $('#restTimer').classList.toggle('warn', left>0 && left<=10);
    // se la traccia non è partita, i segnali li diamo comunque qui
    if(!this.audio && IMP().preavviso){
      if(left<=10 && left>3 && !this.ticked.p10){ this.ticked.p10=1; beep(660,.14); buzz([90]); }
      if(left<=3 && left>0 && !this.ticked['t'+left]){ this.ticked['t'+left]=1; beep(780,.09); }
    }
    if(left<=0) this.fine();
  },
  fine(){
    if(this.scaduto) return;
    this.scaduto=true;
    clearInterval(this.iv); this.iv=null;
    const el=$('#restTimer'); el.classList.remove('warn'); el.classList.add('on','go');
    $('#restRunning').hidden=true; $('#restGo').hidden=false;
    $('#restGoNext').textContent=this.next;
    $('#restCd').textContent='0:00'; $('#restBar').style.width='100%';
    document.title='▶ VIA! · You and Fit';
    if(!this.audio) allarme();          // la traccia ha già l'allarme dentro
    buzz([260,120,260,120,420]);
    // la schermata resta finché non la chiudi tu
  },
  /* rientro dopo schermo spento o cambio app */
  risveglio(){
    if(!this.end) return;
    if(Date.now()>=this.end){ if(!this.scaduto){ this.recuperoScaduto(); } }
    else this.tick();
  },
  recuperoScaduto(){
    this.fine();
    if(IMP().suono){ unlockAudio(); allarme(); }   // la traccia era muta in background
    toast('Recupero finito mentre eri fuori dall\'app');
  }
};

function buzz(pat){ try{ if(IMP().vibra && navigator.vibrate) navigator.vibrate(pat); }catch(e){} }
let AC=null;
/* dice al telefono che tipo di suono stiamo facendo:
   'transient' abbassa la musica un istante e la riprende, come il navigatore;
   'playback' la mette in pausa, ma permette di suonare anche a schermo spento. */
function audioSessionSet(t){ try{ if(navigator.audioSession) navigator.audioSession.type=t; }catch(e){} }
function modoAudio(){ return (IMP().audioMode==='sveglia')?'sveglia':'mix'; }
function unlockAudio(){ try{
  audioSessionSet(modoAudio()==='sveglia'?'playback':'transient');
  AC=AC||new (window.AudioContext||window.webkitAudioContext)();
  if(AC.state==='suspended') AC.resume(); }catch(e){} }
function beep(freq,dur,when){
  if(!IMP().suono) return;
  try{ unlockAudio(); if(!AC) return;
    const o=AC.createOscillator(), g=AC.createGain();
    o.type='square'; o.frequency.value=freq; o.connect(g); g.connect(AC.destination);
    const t=AC.currentTime+(when||0);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(modoAudio()==='mix'?.6:.3,t+.01);
    g.gain.exponentialRampToValueAtTime(.0001,t+dur); o.start(t); o.stop(t+dur+.02);
  }catch(e){}
}
function allarme(){
  const seq = modoAudio()==='mix' ? [0,.26,.52,.80,1.08,1.40] : [0,.30,.60,.95];
  seq.forEach((o,i)=>beep(i%2?1180:940,.24,o));
}

/* lo schermo non si spegne mentre ti alleni */
let WL=null;
async function wakeOn(){ try{ if('wakeLock' in navigator && !WL){
  WL=await navigator.wakeLock.request('screen');
  WL.addEventListener('release',()=>{ WL=null; }); } }catch(e){ WL=null; } }
function wakeOff(){ try{ if(WL){ WL.release(); WL=null; } }catch(e){} }

document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible') return;
  unlockAudio();
  if(DB && DB.corrente) wakeOn();
  Rest.risveglio();
});
window.addEventListener('pageshow',()=>{ Rest.risveglio(); });
/* ogni tocco riabilita l'audio, che iOS sospende appena esci dall'app */
document.addEventListener('pointerdown',()=>unlockAudio(),{passive:true});

/* cosa funziona davvero su questo dispositivo */
function diagnostica(){
  const ios=/iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  return {
    ios,
    vibra: !!navigator.vibrate,
    wake: 'wakeLock' in navigator,
    audio: !!(window.AudioContext||window.webkitAudioContext),
    sessione: !!(navigator.audioSession),
    standalone: !!(window.matchMedia('(display-mode: standalone)').matches || navigator.standalone)
  };
}

      :(lg.cardio?`<p class="tiny muted">Cardio: ${esc(lg.cardio.tipo)} · ${lg.cardio.min} min · ${lg.cardio.kcal} kcal</p>`:'')}

</script>
<script>
/* ===================== NUTRIZIONE ===================== */
function todayTargets(){
  const d=new Date().getDay(); const idx=(d+6)%7; // 0=lun
  const on = !!DB.nutri.pattern[idx];
  return {on, m: on?DB.nutri.targetOn:DB.nutri.targetOff};
}
function solveN(A,b){
  const n=b.length, M=A.map((r,i)=>[...r,b[i]]);
  for(let i=0;i<n;i++){
    let piv=i; for(let r=i+1;r<n;r++) if(Math.abs(M[r][i])>Math.abs(M[piv][i])) piv=r;
    if(Math.abs(M[piv][i])<1e-9) continue;
    [M[i],M[piv]]=[M[piv],M[i]];
    for(let r=0;r<n;r++){ if(r===i) continue; const f=M[r][i]/M[i][i];
      for(let c=i;c<=n;c++) M[r][c]-=f*M[i][c]; }
  }
  return M.map((r,i)=> Math.abs(r[i])<1e-9?0:r[n]/r[i]);
}
const DOM={carb:0,frut:0,prot:1,gras:2};
function prefFoods(meal,tipo){
  return DB.nutri.foods.filter(f=>f.pref && f.m.includes(meal) && f.t===tipo);
}
function macroVec(f){ return [f.c/100, f.p/100, f.f/100]; }

/* composizione dei pasti: quanti alimenti e quali porzioni fisse */
const TEMPLATE={
  COL:{frut:60,  extra:1, prot:1, carb:1, gras:0},
  SP1:{frut:100, extra:1, prot:1, carb:1, gras:0},
  PRA:{verd:250,          prot:1, carb:1, gras:1},
  SP2:{frut:100,          prot:1, carb:1, gras:0},
  CEN:{verd:250,          prot:1, carb:1, gras:1},
  SP3:{frut:50,           prot:1, carb:1, gras:1}
};
const NALT=4; // quante alternative mostrare per alimento

function buildMeal(meal, target, rot){
  const T=TEMPLATE[meal]||{prot:1,carb:1,gras:1};
  const pick=(tipo,off)=>{ const a=prefFoods(meal,tipo); return a.length? a[(rot+(off||0))%a.length] : null; };
  const items=[]; let rem=[target[0],target[1],target[2]];
  const fisso=(tipo,g,off)=>{
    if(!g) return; const f=pick(tipo,off); if(!f) return;
    const gr=f.porz||g;
    items.push({...mkItem(f,gr), fixed:true, alt:altList(f,meal,gr)});
    rem=rem.map((x,i)=>x-macroVec(f)[i]*gr);
  };
  fisso('verd',T.verd,0);
  fisso('frut',T.frut,1);
  fisso('extra',T.extra,2);
  // alimenti calcolati: uno per macro dominante
  const chosen=[];
  if(T.prot){ const f=pick('prot',3); if(f) chosen.push(f); }
  if(T.carb){ const f=pick('carb',4); if(f) chosen.push(f); }
  if(T.gras){ const f=pick('gras',5); if(f) chosen.push(f); }
  if(chosen.length){
    const rows=chosen.map(f=>DOM[f.t]);
    const A=rows.map(r=>chosen.map(f=>macroVec(f)[r]));
    const b=rows.map(r=>rem[r]);
    const g=solveN(A,b);
    chosen.forEach((f,i)=>{
      let v=g[i]; if(!isFinite(v)||v<0) v=0;
      const maxG = f.t==='gras'?90:(f.t==='prot'?420:400);
      v=clamp(v,0,maxG);
      v = Math.max(10, Math.round(v/5)*5);   // porzioni sempre sensate, mai 5 g di mandorle
      items.push({...mkItem(f,v), alt:altList(f,meal,v)});
    });
  }
  const ORD={prot:0,carb:1,verd:2,frut:3,gras:4,extra:5};
  items.sort((a,b)=>{
    const fa=DB.nutri.foods.find(x=>x.id===a.id), fb=DB.nutri.foods.find(x=>x.id===b.id);
    return (ORD[fa&&fa.t]??9)-(ORD[fb&&fb.t]??9);
  });
  const tot=items.reduce((a,it)=>({c:a.c+it.c,p:a.p+it.p,f:a.f+it.f}),{c:0,p:0,f:0});
  return {k:meal, items, tot:{c:Math.round(tot.c),p:Math.round(tot.p),f:Math.round(tot.f)}};
}
function mkItem(f,g){ return {id:f.id,n:f.n,g,c:f.c*g/100,p:f.p*g/100,f:f.f*g/100,kcal:Math.round(f.k*g/100)}; }
function altList(f,meal,g){
  const same=prefFoods(meal,f.t).filter(x=>x.id!==f.id).slice(0,NALT);
  // verdure: stesse quantita, come dice il coach. extra: porzione propria.
  if(f.t==='verd') return same.map(x=>({n:x.n, g, kcal:Math.round(x.k*g/100)}));
  if(f.t==='extra') return same.map(x=>{ const gg=x.porz||g; return {n:x.n, g:gg, kcal:Math.round(x.k*gg/100)}; });
  const d=DOM[f.t]!==undefined?DOM[f.t]:0, base=macroVec(f)[d]*g;
  return same.map(x=>{
    const per=macroVec(x)[d];
    let gg = per>0 ? Math.round(base/per/5)*5 : (x.porz||g);
    gg = clamp(gg||g, 5, 500);
    return {n:x.n, g:gg, kcal:Math.round(x.k*gg/100)};
  });
}
function correggiGiorno(pasti,T){
  const somma=k=>pasti.reduce((a,p)=>a+p.items.reduce((x,i)=>x+i[k],0),0);
  const foodOf=it=>DB.nutri.foods.find(x=>x.id===it.id);
  function scala(){
    [['gras','f'],['carb','c'],['prot','p']].forEach(([tipo,mk])=>{
      const pool=[];
      pasti.forEach(p=>p.items.forEach(it=>{ if(it.fixed) return;
        const f=foodOf(it); if(f&&f.t===tipo) pool.push({it,f,meal:p.k}); }));
      if(!pool.length) return;
      const dev=somma(mk)-T[mk], cont=pool.reduce((a,o)=>a+o.it[mk],0);
      if(cont<=0 || Math.abs(dev)<3) return;
      const k=clamp((cont-dev)/cont,.3,2.2);
      pool.forEach(o=>{ const g=Math.max(10, Math.round(o.it.g*k/5)*5);
        Object.assign(o.it, mkItem(o.f,g)); o.it.alt=altList(o.f,o.meal,g); });
    });
  }
  // sostituisce gli alimenti piu grassi con alternative magre finche i grassi rientrano
  function sgrassa(){
    for(let pass=0; pass<5; pass++){
      if(somma('f')-T.f <= 4) return;
      let best=null;
      pasti.forEach(p=>p.items.forEach(it=>{
        if(it.fixed) return;
        const f=foodOf(it); if(!f || f.t==='gras') return;
        const magre=prefFoods(p.k,f.t).filter(x=>x.f<f.f-0.5);
        if(!magre.length) return;
        const lean=magre.reduce((a,b)=>a.f<b.f?a:b);
        const d=DOM[f.t], per=macroVec(lean)[d]; if(per<=0) return;
        const g=Math.max(10,Math.round(macroVec(f)[d]*it.g/per/5)*5);
        const gain=it.f - lean.f*g/100;
        if(gain>0.5 && (!best || gain>best.gain)) best={it,lean,g,gain,meal:p.k};
      }));
      if(!best) return;
      Object.assign(best.it, mkItem(best.lean,best.g));
      best.it.alt=altList(best.lean,best.meal,best.g);
    }
  }
  scala(); sgrassa(); scala();
  pasti.forEach(p=>{ p.tot={c:Math.round(p.items.reduce((a,i)=>a+i.c,0)),
    p:Math.round(p.items.reduce((a,i)=>a+i.p,0)), f:Math.round(p.items.reduce((a,i)=>a+i.f,0))}; });
}
function generaPiano(){
  const n=DB.nutri, giorni=[];
  for(let d=0;d<7;d++){
    const on=!!n.pattern[d]; const T=on?n.targetOn:n.targetOff;
    const pasti=MEALS.map(([k],mi)=>{
      const dist=n.distrib[k];
      return buildMeal(k,[T.c*dist[0],T.p*dist[1],T.f*dist[2]], d+mi+n.seed);
    });
    correggiGiorno(pasti,T);
    const tot=pasti.reduce((a,p)=>({c:a.c+p.tot.c,p:a.p+p.tot.p,f:a.f+p.tot.f}),{c:0,p:0,f:0});
    giorni.push({on,pasti,tot,target:T});
  }
  n.piano={giorni, gen:Date.now(), sel:(new Date().getDay()+6)%7};

/* ===================== PIANO DEL COACH ===================== */
function foodById(id){ return DB.nutri.foods.find(f=>f.id===id); }
function macroVoce(v){
  const f=v.fid?foodById(v.fid):null;
  if(!f || !v.g) return null;
  return {c:f.c*v.g/100, p:f.p*v.g/100, f:f.f*v.g/100, kcal:Math.round(f.k*v.g/100)};
}
function pianoCoachSel(){ return PIANI_COACH[clamp(DB.nutri.pianoCoach??4,0,PIANI_COACH.length-1)]; }
function latoCoach(){ return DB.nutri.latoCoach==='off'?'off':'on'; }

/* alternative calcolate dall'app, escluse quelle che il coach ha già scritto */
function variantiVoce(v, mealKey){
  const f=v.fid?foodById(v.fid):null;
  if(!f || !v.g) return [];
  const gia=new Set([v.fid, ...(v.alt||[]).map(a=>a.fid).filter(Boolean)]);
  const cand=DB.nutri.foods.filter(x=>x.pref && x.t===f.t && !gia.has(x.id) &&
      (x.m.includes(mealKey)||f.t==='verd'||f.t==='frut'));
  const d=DOM[f.t]!==undefined?DOM[f.t]:0, base=macroVec(f)[d]*v.g;
  return cand.slice(0,4).map(x=>{
    if(f.t==='verd') return {n:x.n, g:v.g};
    const per=macroVec(x)[d];
    let gg = per>0 ? Math.round(base/per/5)*5 : v.g;
    return {n:x.n, g:clamp(gg||v.g,5,600)};
  });
}
function totaliCoach(sezioni){
  const t={c:0,p:0,f:0}; let mancanti=0;
  sezioni.forEach(s=>s.voci.forEach(v=>{
    const m=macroVoce(v);
    if(m){ t.c+=m.c; t.p+=m.p; t.f+=m.f; } else mancanti++;
  }));
  return {c:Math.round(t.c), p:Math.round(t.p), f:Math.round(t.f), mancanti};
}

  <p class="tiny muted">Le voci qui sopra sono quelle scritte dal tuo coach, riportate come stanno nel file.

/* campi che cambiano in base all'attrezzo */
function campiCardio(i){
  const t=CARDIO_TIPI[i]||CARDIO_TIPI[0];
  if(t.calc==='tapis') return `<div class="row wrap">
    <label class="fld">Velocità (km/h)<input type="number" step="0.5" id="cdKmh" value="${t.met>8?10:6}" inputmode="decimal"></label>
    <label class="fld">Inclinazione (%)<input type="number" step="0.5" id="cdInc" value="0" inputmode="decimal"></label></div>`;
  if(t.calc==='watt') return `<div class="row wrap">
    <label class="fld">Watt medi<input type="number" id="cdWatt" placeholder="facoltativo" inputmode="numeric"></label>
    <label class="fld">Intensità<select id="cdLiv">
      <option value="0.75">Leggera</option><option value="1" selected>Media</option>
      <option value="1.3">Intensa</option></select></label></div>`;
  return `<label class="fld">Intensità<select id="cdLiv">
      <option value="0.75">Leggera</option><option value="1" selected>Media</option>
      <option value="1.3">Intensa</option></select></label>`;
}

/* ACSM per tapis e corsa, watt per la bike, MET per gli altri */
function calcolaCardio(){
  const sel=$('#cdTipo'); const i=sel?+sel.value:0;
  const t=CARDIO_TIPI[i]||CARDIO_TIPI[0];
  const mi=$('#cdMin'); const min=clamp(mi?+mi.value||0:0,0,300);
  const peso=DB.profilo.peso||80;
  let met=t.met, formula='', dett='';
  if(t.calc==='tapis'){
    const kmh=clamp($('#cdKmh')?+$('#cdKmh').value||0:6,0,25);
    const inc=clamp($('#cdInc')?+$('#cdInc').value||0:0,0,30);
    const S=kmh*1000/60, G=inc/100;
    const vo2 = kmh>=7 ? (0.2*S + 0.9*S*G + 3.5) : (0.1*S + 1.8*S*G + 3.5);
    met=Math.max(1.5, vo2/3.5);
    formula=`${kmh} km/h · ${inc}% · ${met.toFixed(1)} MET`;
    dett=`${kmh} km/h, ${inc}%`;
  } else if(t.calc==='watt'){
    const w=$('#cdWatt')?+$('#cdWatt').value||0:0;
    const liv=$('#cdLiv')?+$('#cdLiv').value||1:1;
    if(w>0){ met=Math.max(1.5,(7+10.8*w/peso)/3.5); formula=`${w} W · ${met.toFixed(1)} MET`; dett=`${w} W`; }
    else { met=t.met*liv; formula=`${met.toFixed(1)} MET`;
      dett=$('#cdLiv')?$('#cdLiv').selectedOptions[0].text:''; }
  } else {
    const liv=$('#cdLiv')?+$('#cdLiv').value||1:1;
    met=t.met*liv; formula=`${met.toFixed(1)} MET`;
    dett=$('#cdLiv')?$('#cdLiv').selectedOptions[0].text:'';
  }
  return {kcal:Math.round(met*peso*(min/60)), met, formula, dett, min, tipo:t.n};
}
function aggiornaCardio(){
  if(!$('#cdOut')) return;
  const r=calcolaCardio();
  $('#cdOut').textContent=r.kcal+' kcal';
  $('#cdForm').textContent=`${r.formula} × ${DB.profilo.peso} kg × ${r.min} min`;
  const k=$('#cdKcal'); if(k && k.hidden) k.value=r.kcal;
}
function metKcal(met,min){ return Math.round(met*DB.profilo.peso*(min/60)); }
function kcalPesi(sec){ return Math.round(DB.profilo.metPesi*DB.profilo.peso*(Math.max(0,sec)/3600)); }

/* ===================== STATISTICHE ===================== */
function statAvgMin(){ if(!DB.log.length) return 0; return Math.round(DB.log.reduce((a,l)=>a+l.durataSec,0)/DB.log.length/60); }
function statKcalSett(){ const lim=Date.now()-7*864e5;
  return DB.log.filter(l=>new Date(l.data+'T00:00:00').getTime()>=lim).reduce((a,l)=>a+l.kcal,0); }
function barChart(vals,labels,color,unit){
  if(!vals.length) return '<p class="tiny muted">Ancora nessun dato: completa il primo allenamento.</p>';
  const W=320,H=130,pad=26,bw=(W-pad-6)/vals.length, max=Math.max(...vals,1);
  return `<svg class="chart" viewBox="0 0 ${W} ${H+26}" role="img">
    ${[0,.5,1].map(t=>`<line x1="${pad}" y1="${H-t*(H-18)}" x2="${W}" y2="${H-t*(H-18)}" stroke="#2D2D38" stroke-width="1"/>
      <text x="0" y="${H-t*(H-18)+4}" fill="#6E6E7C" font-size="9">${Math.round(max*t)}</text>`).join('')}
    ${vals.map((v,i)=>{const h=(v/max)*(H-18); return `<rect x="${pad+i*bw+2}" y="${H-h}" width="${bw-5}" height="${Math.max(1,h)}" rx="3" fill="${color}"/>
      <text x="${pad+i*bw+bw/2}" y="${H+13}" fill="#6E6E7C" font-size="8.5" text-anchor="middle">${esc(labels[i])}</text>`;}).join('')}
  </svg><div class="tiny muted" style="text-align:right">${unit}</div>`;
}
function lineChart(vals,labels,color,unit){
  if(vals.length<2) return '<p class="tiny muted">Servono almeno due sedute con questo esercizio.</p>';
  const W=320,H=130,pad=28, max=Math.max(...vals)*1.1, min=Math.min(...vals)*.9;
  const x=i=>pad+i*(W-pad-6)/(vals.length-1), y=v=>H-((v-min)/((max-min)||1))*(H-18);
  const d=vals.map((v,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(v).toFixed(1)).join(' ');
  return `<svg class="chart" viewBox="0 0 ${W} ${H+26}" role="img">
    ${[0,.5,1].map(t=>`<line x1="${pad}" y1="${H-t*(H-18)}" x2="${W}" y2="${H-t*(H-18)}" stroke="#2D2D38" stroke-width="1"/>
      <text x="0" y="${H-t*(H-18)+4}" fill="#6E6E7C" font-size="9">${Math.round(min+(max-min)*t)}</text>`).join('')}
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round"/>
    ${vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(v).toFixed(1)}" r="${i===vals.length-1?4:2.6}" fill="${color}"/>`).join('')}
    ${labels.map((l,i)=> i%Math.ceil(vals.length/5)===0?`<text x="${x(i).toFixed(1)}" y="${H+13}" fill="#6E6E7C" font-size="8.5" text-anchor="middle">${esc(l)}</text>`:'').join('')}
  </svg><div class="tiny muted" style="text-align:right">${unit}</div>`;
}
function statsView(){
  const L=DB.log, tot=DB.programma.sedute.length;
  const last=L.slice(-10);
  const nomi=[...new Set(L.flatMap(l=>l.esercizi.map(e=>e.nome)))].sort();
  const selEx = statsView.ex && nomi.includes(statsView.ex) ? statsView.ex : nomi[0];
  const prog = selEx? L.map(l=>{ const e=l.esercizi.find(x=>x.nome===selEx);
      if(!e) return null; const kgs=e.serie.map(s=>+s.kg||0).filter(Boolean);
      return kgs.length?{d:l.data,v:Math.max(...kgs)}:null; }).filter(Boolean) : [];
  // kcal per settimana (ultime 8)
  const wk={}; L.forEach(l=>{ const d=new Date(l.data+'T00:00:00'); const on=new Date(d); on.setDate(d.getDate()-((d.getDay()+6)%7));
    const k=iso(on); wk[k]=(wk[k]||0)+l.kcal; });
  const wkKeys=Object.keys(wk).sort().slice(-8);
  const cardioMin=L.reduce((a,l)=>a+(l.cardio?l.cardio.min:0),0);
  return `<div class="view">
    <div class="kpi">
      <div><b class="num">${L.length}<span style="font-size:15px;color:var(--muted)">/${tot}</span></b><span>Allenamenti</span></div>
      <div><b class="num red">${tot?Math.round(L.filter(l=>l.seduteId).length/tot*100):0}%</b><span>Aderenza al piano</span></div>
      <div><b class="num">${statAvgMin()}</b><span>Durata media (min)</span></div>
      <div><b class="num">${L.reduce((a,l)=>a+l.kcal,0).toLocaleString('it-IT')}</b><span>Kcal totali stimate</span></div>
      <div><b class="num">${cardioMin}</b><span>Minuti cardio totali</span></div>
      <div><b class="num">${(L.reduce((a,l)=>a+l.volume,0)/1000).toFixed(1)}t</b><span>Volume sollevato</span></div>
    </div>
    <div class="card stack">
      <h3>Durata delle sedute</h3>
      ${barChart(last.map(l=>Math.round(l.durataSec/60)), last.map(l=>fmtData(l.data).split(' ')[1]), '#E31B23','minuti · ultime 10 sedute')}
    </div>
    <div class="card stack">
      <h3>Calorie bruciate per settimana</h3>
      ${barChart(wkKeys.map(k=>wk[k]), wkKeys.map(k=>fmtData(k).split(' ')[1]), '#FF3A32','kcal · settimana dal lunedì')}
    </div>
    <div class="card stack">
      <h3>Andamento carichi</h3>
      ${nomi.length?`<label class="fld">Esercizio<select id="statEx">${nomi.map(n=>`<option${n===selEx?' selected':''}>${esc(n)}</option>`).join('')}</select></label>
      ${lineChart(prog.map(p=>p.v), prog.map(p=>fmtData(p.d).split(' ')[1]), '#5AB7F0','kg · massimo per seduta')}`
      :'<p class="tiny muted">Registra i pesi durante gli allenamenti per vedere qui la progressione.</p>'}
    </div>
    <div class="card stack">
      <h3>Volume per seduta</h3>
      ${lineChart(last.map(l=>l.volume), last.map(l=>fmtData(l.data).split(' ')[1]), '#3FD07A','kg totali (peso × ripetizioni)')}
    </div>
    <div class="card stack">
      <div class="rowhead"><h3>Storico allenamenti</h3><span class="chip">${L.length}</span></div>
      ${L.length?[...L].reverse().map(l=>`<div class="planline">
        <span class="grow"><span style="font-weight:600">${esc(l.blocco)}</span>
          <div class="tiny muted">${fmtData(l.data)}${l.seduteId?'':' · fuori calendario'}</div></span>
        <span class="g tiny num">${Math.round(l.durataSec/60)} min · ${l.kcal} kcal · ${l.volume.toLocaleString('it-IT')} kg</span>
        <button class="btn soft sm" data-act="delLog" data-id="${l.id}">×</button></div>`).join('')
        :'<p class="tiny muted">Nessun allenamento registrato.</p>'}
    </div>
  </div>`;
}

  async get(k){ try{ const db=await this.open(); return await new Promise(res=>{
      const q=db.transaction('foto').objectStore('foto').get(k);
      q.onsuccess=()=>res(q.result||null); q.onerror=()=>res(null); }); }catch(e){ return null; } },
  async set(k,v){ try{ const db=await this.open(); return await new Promise(res=>{
      const q=db.transaction('foto','readwrite').objectStore('foto').put(v,k);
      q.onsuccess=()=>res(true); q.onerror=()=>res(false); }); }catch(e){ return false; } },
  async del(k){ try{ const db=await this.open(); return await new Promise(res=>{
      const q=db.transaction('foto','readwrite').objectStore('foto').delete(k);
      q.onsuccess=()=>res(true); q.onerror=()=>res(false); }); }catch(e){ return false; } }
};
function comprimiFoto(file){
  return new Promise(res=>{
    const fr=new FileReader();
    fr.onload=()=>{ const im=new Image();
      im.onload=()=>{ const max=900, sc=Math.min(1,max/Math.max(im.width,im.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(im.width*sc); cv.height=Math.round(im.height*sc);
        cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);
        try{ res(cv.toDataURL('image/jpeg',.72)); }catch(e){ res(null); } };
      im.onerror=()=>res(null); im.src=fr.result; };
    fr.onerror=()=>res(null); fr.readAsDataURL(file);
  });
}

<script>
/* ===================== MEMORIA: SOLO QUESTO TELEFONO =====================
   Nessun account, nessun server, nessuna sincronizzazione.
   Tutto in localStorage (dati) e IndexedDB (foto degli esercizi).

   Il punto delicato su iPhone: Safari non lascia salvare niente a una pagina
   aperta DENTRO un'altra pagina. Quindi all'avvio controlliamo dove siamo e,
   se siamo incorniciati, mostriamo una schermata che apre l'app a tutto schermo
   al suo indirizzo. Da lì la memoria funziona e si può aggiungere alla Home. */

const DENTRO_CORNICE = (()=>{ try{ return window.self!==window.top; }catch(e){ return true; } })();
const STANDALONE = (()=>{ try{
  return window.navigator.standalone===true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
}catch(e){ return false; } })();
const IOS = /iPad|iPhone|iPod/.test(navigator.userAgent||'');

let LS_OK=null, ULTIMO_SALVA=0, ERR_SALVA='';

/* ---- la prova che conta: i dati sopravvivono alla chiusura? ----
   Scrivere senza errori non basta: Safari, nelle pagine aperte dentro altre pagine,
   accetta la scrittura e poi la cancella. L'unico modo di saperlo è lasciare un
   segno, chiudere, riaprire e vedere se c'è ancora. */
const SEGNO='__yaf_segno';
let PERSISTE=null;            // null = ancora da verificare, true/false = verdetto
let APERTURE=0, PRIMA_APERTURA=0, ULTIMA_APERTURA=0;
function verificaPersistenza(){
  try{
    const v=localStorage.getItem(SEGNO);
    if(v){
      const o=JSON.parse(v);
      PERSISTE=true; APERTURE=(+o.n||1)+1; PRIMA_APERTURA=+o.nato||0; ULTIMA_APERTURA=+o.t||0;
      localStorage.setItem(SEGNO, JSON.stringify({n:APERTURE, t:Date.now(), nato:PRIMA_APERTURA||Date.now()}));
    }else{
      PERSISTE=null; APERTURE=1; PRIMA_APERTURA=Date.now();
      localStorage.setItem(SEGNO, JSON.stringify({n:1, t:Date.now(), nato:PRIMA_APERTURA}));
    }
  }catch(e){ PERSISTE=false; }
}
function localeFunziona(){
  try{ localStorage.setItem('__yaf_t','1'); localStorage.removeItem('__yaf_t'); LS_OK=true; }
  catch(e){ LS_OK=false; ERR_SALVA=String((e&&e.name)||e); }
  return LS_OK;
}

/* --- scrittura --- */
function salvaLocale(){
  try{
    localStorage.setItem(KEY, JSON.stringify(DB));
    LS_OK=true; ULTIMO_SALVA=Date.now(); ERR_SALVA='';
    return true;
  }catch(e){
    LS_OK=false;
    ERR_SALVA = (String(e&&e.name)==='QuotaExceededError')
      ? 'memoria del telefono piena' : 'il browser non lascia salvare';
    return false;
  }
}
function save(){ DB.updatedAt=Date.now(); salvaLocale(); Sync.push(); }
function salvaOra(){ DB.updatedAt=Date.now(); salvaLocale(); Sync.sporco=true; Sync.subito(); }

/* --- lettura --- */
function leggiLocale(){
  try{ const s=localStorage.getItem(KEY); return s?JSON.parse(s):null; }
  catch(e){ return null; }
}

/* --- riga di stato --- */
function oraBreve(ms){ const d=new Date(ms), p=n=>('0'+n).slice(-2);
  return p(d.getHours())+':'+p(d.getMinutes()); }
function statoMemoria(){
  if(LS_OK===null) localeFunziona();
  const on=Sync.attivo, st=Sync.stato;
  if(DENTRO_CLAUDE && (st==='avvio'||st==='leggo')) return {cls:'work', t:'Controllo lo spazio online…'};
  if(st==='salvo') return {cls:'work', t:'Salvataggio in corso…'};
  if(on && Sync.sporco) return {cls:'work', t:'Da salvare…'};
  if(on) return {cls:'ok', t:'Salvato nel tuo spazio'+(Sync.ultimoOk?' · '+oraBreve(Sync.ultimoOk):'')
                 +(PERSISTE===true?' + sul telefono':'')};
  if(st==='pieno') return {cls:'bad', t:'Spazio online esaurito', az:'Vedi'};
  if(st==='erroreSalvataggio') return {cls:'bad', t:'Salvataggio non riuscito, riprovo…', az:'Riprova'};
  if(LS_OK===false) return {cls:'bad', t:DA_FILE?'File scaricato: NON salva niente':'I dati NON vengono salvati', az:'Risolvi'};
  if(PERSISTE===null) return {cls:'work', t:'Prima apertura: chiudi e riapri per verificare la memoria', az:'Spiega'};
  if(PERSISTE===true) return DENTRO_CLAUDE
    ? {cls:'ok', t:'Salvato sul telefono'+(ULTIMO_SALVA?' · '+oraBreve(ULTIMO_SALVA):'')+' · spazio online non attivo', az:'Collega'}
    : {cls:'ok', t:'Memoria verificata · salvato'+(ULTIMO_SALVA?' '+oraBreve(ULTIMO_SALVA):'')
        +(STANDALONE?'':' · aggiungila alla Home'), az:STANDALONE?'':'Come'};
  return {cls:'bad', t:'Qui i dati non restano alla chiusura', az:'Risolvi'};
}
function aggiornaBadgeMemoria(){
  const el=document.getElementById('memLine'); if(!el) return;
  const m=statoMemoria();
  el.hidden=false; el.className='memline '+m.cls;
  el.innerHTML='<span class="dot"></span><span>'+m.t+'</span>'+(m.az?'<span class="az">'+m.az+'</span>':'');
}
function descrizioneMemoria(){
  return {locale:LS_OK!==false, cornice:DENTRO_CORNICE, installata:STANDALONE,
          ultimo:ULTIMO_SALVA, errore:ERR_SALVA||Sync.errore,
          persiste:PERSISTE, aperture:APERTURE, ultimaApertura:ULTIMA_APERTURA,
          online:Sync.attivo, ultimoOnline:Sync.ultimoOk, daSalvare:Sync.sporco};
}

/* riquadro in Home finché la prova non è stata fatta */
function cartaProva(){
  if(Sync.attivo) return '';
  if(DENTRO_CLAUDE && (Sync.stato==='avvio'||Sync.stato==='leggo')) return '';
  if(LS_OK===false || PERSISTE===true) return '';
  return `<div class="card stack" style="border-color:var(--warn)">
    <div class="rowhead"><h3 style="color:var(--warn)">Prova della memoria: da fare</h3></div>
    <p class="tiny muted">Ho lasciato un segno in questo telefono. <b>Chiudi l'app del tutto
    e riaprila da dove l'hai aperta adesso.</b> Se ritrovo il segno, questo riquadro sparisce
    e da lì in poi puoi fidarti. Se invece lo rivedi uguale, vuol dire che qui i dati non
    sopravvivono: non caricare niente e dimmelo.</p>
    <p class="tiny muted">Non c'è niente da toccare: basta chiudere e riaprire.</p>
  </div>`;
}

/* ===================== SPAZIO ONLINE PRIVATO =====================
   Su iPhone, dentro la pagina di Claude, Safari accetta i salvataggi e poi li
   butta via alla chiusura: provato sul campo. Quindi la memoria vera è lo spazio
   online privato legato all'account — nessun altro può leggerlo — e il telefono
   fa da copia veloce. Così i dati ci sono da qualunque porta si entri. */
const Sync={
  db:null, uid:null, attivo:false, stato:'avvio', errore:'',
  tPush:null, tRetry:null, inCorso:false, sporco:false, tentativi:0,
  ultimoOk:0, inviati:new Set(), daCancellare:[], ultimi:{},

  /* ---------- avvio e collegamento ---------- */
  async init(){
    clearTimeout(this.tRetry);
    this.setStato('avvio');
    try{
      if(typeof claude==='undefined' || !claude || !claude.use){ this.setStato('locale'); return valutaMemoria(); }
      const [db,user]=await Promise.all([claude.use('db'), claude.use('user')]);
      if(!db || !user){ this.setStato('locale'); return valutaMemoria(); }
      const uid=await user.id();
      if(!uid){ this.errore='account non riconosciuto'; this.setStato('nonCollegato'); return this.ritenta(); }
      this.db=db; this.uid=uid; this.attivo=true; this.errore='';
      await this.pull();
      if(this.sporco || !localeFunziona()) await this.pushOra();
      valutaMemoria();
    }catch(e){
      this.errore=String((e&&e.message)||e||'').slice(0,120);
      this.attivo=false; this.setStato('nonCollegato'); this.ritenta(); valutaMemoria();
    }
  },
  ritenta(){
    if(this.tentativi>=6) return;
    this.tentativi++;
    clearTimeout(this.tRetry);
    this.tRetry=setTimeout(()=>this.init(), Math.min(30000, 1500*this.tentativi));
  },
  setStato(s){ this.stato=s; aggiornaBadgeMemoria(); },
  mio(){ return this.db.collection('data/users/'+this.uid); },
  mioLog(){ return this.db.collection('data/users/'+this.uid+'/log'); },

  /* i dati divisi in blocchi: si riscrive solo quello che è cambiato */
  sezioni(){ return {
    stato:    {profilo:DB.profilo, impostazioni:DB.impostazioni, programma:DB.programma, vSchede:DB.vSchede},
    schede:   {schede:DB.schede||[]},
    nutri:    {nutri:DB.nutri},
    corrente: {corrente:DB.corrente||null}
  }; },

  /* ---------- lettura ---------- */
  async pull(){
    this.setStato('leggo');
    const [st,sc,nu,cu,lg]=await Promise.all([
      this.mio().doc('stato').get(), this.mio().doc('schede').get(),
      this.mio().doc('nutri').get(), this.mio().doc('corrente').get(), this.mioLog().get()
    ]);
    const D=d=>(d && d.exists) ? (d.data()||{}) : null;
    const S=D(st), C=D(sc), N=D(nu), U=D(cu);
    let cambiato=false;

    // allenamenti: unione per id, nessuno viene mai perso
    const locali=new Map((DB.log||[]).map(l=>[l.id,l]));
    lg.docs.forEach(d=>{ const v=d.data(); if(v && v.v && v.v.id){
      this.inviati.add(v.v.id);
      if(!locali.has(v.v.id)){ locali.set(v.v.id, v.v); cambiato=true; } } });
    DB.log=[...locali.values()].sort((a,b)=>String(a.data).localeCompare(String(b.data)));

    // il resto: vince la versione più recente
    const tsL = NUOVO_DB ? 0 : (+DB.updatedAt||0);   // partenza da zero: online vince sempre
    const ts=o=>(o && +o.updatedAt) || 0;
    const tsR=Math.max(ts(S),ts(C),ts(N),ts(U));
    if(tsR>tsL){
      if(S){ ['profilo','impostazioni','programma','vSchede'].forEach(k=>{ if(S[k]!==undefined) DB[k]=S[k]; });
             if(S.nutri && !N) DB.nutri=S.nutri;            // formato vecchio: tutto dentro "stato"
             if(S.corrente!==undefined && !U) DB.corrente=S.corrente; }
      if(C && Array.isArray(C.schede)) DB.schede=C.schede;
      if(N && N.nutri) DB.nutri=N.nutri;
      if(U && U.corrente!==undefined) DB.corrente=U.corrente;
      DB.updatedAt=tsR; cambiato=true;
    }
    // so cosa c'è già online: riscriverò solo le parti che non coincidono
    const rem={
      stato:    S? {profilo:S.profilo, impostazioni:S.impostazioni, programma:S.programma, vSchede:S.vSchede} : null,
      schede:   C? {schede:C.schede||[]} : null,
      nutri:    N? {nutri:N.nutri} : null,
      corrente: U? {corrente:U.corrente===undefined?null:U.corrente} : null
    };
    const SE=this.sezioni();
    Object.keys(SE).forEach(k=>{
      if(rem[k]) this.ultimi[k]=JSON.stringify(rem[k]); else delete this.ultimi[k];
      if(this.ultimi[k]!==JSON.stringify(SE[k])) this.sporco=true;
    });
    if((DB.log||[]).some(l=>!this.inviati.has(l.id))) this.sporco=true;

    this.tentativi=0; this.ultimoOk=Date.now(); this.setStato('collegato');
    if(cambiato){ salvaLocale(); if(typeof render==='function') render();
      toast('Dati recuperati dal tuo spazio online'); }
  },

  /* ---------- scrittura ---------- */
  push(){
    this.sporco=true;
    aggiornaBadgeMemoria();
    if(!this.attivo) return;
    clearTimeout(this.tPush);
    this.tPush=setTimeout(()=>this.pushOra(), 400);   // breve: il telefono può chiudere la pagina
  },
  async pushOra(){
    if(!this.attivo || this.inCorso) return;
    this.inCorso=true; this.sporco=false; this.setStato('salvo');
    try{
      const SE=this.sezioni(), ts=DB.updatedAt||Date.now();
      for(const k of Object.keys(SE)){
        const j=JSON.stringify(SE[k]);
        if(this.ultimi[k]===j) continue;
        await this.mio().doc(k).set(Object.assign({updatedAt:ts}, SE[k]));
        this.ultimi[k]=j;
      }
      for(const l of (DB.log||[])){
        if(this.inviati.has(l.id)) continue;
        await this.mioLog().doc(l.id).set({v:l});
        this.inviati.add(l.id);
      }
      while(this.daCancellare.length){
        const id=this.daCancellare[0];
        await this.mioLog().doc(id).delete();
        this.daCancellare.shift(); this.inviati.delete(id);
      }
      this.ultimoOk=Date.now(); this.tentativi=0; this.errore=''; this.setStato('collegato');
    }catch(e){
      this.sporco=true;
      this.errore=String((e&&e.message)||e||'').slice(0,120);
      this.setStato(String(e&&e.code)==='quota_exceeded'?'pieno':'erroreSalvataggio');
    }finally{
      this.inCorso=false;
      if(this.sporco){ clearTimeout(this.tPush); this.tPush=setTimeout(()=>this.pushOra(), 3000); }
      aggiornaBadgeMemoria();
    }
  },
  /* chiusura app / cambio schermata: salva adesso, senza aspettare */
  subito(){
    if(!this.attivo){ if(this.sporco) this.init(); return; }
    clearTimeout(this.tPush);
    if(this.sporco && !this.inCorso) this.pushOra();
  },
  scordaLog(id){ this.daCancellare.push(id); this.push(); },
  /* ritorno in primo piano / rete tornata */
  risveglio(){
    if(!this.attivo){ this.tentativi=0; this.init(); return; }
    if(this.sporco) this.pushOra();
  }
};


/* decide cosa dire e se bloccare, una volta noto anche lo stato online */
function valutaMemoria(){
  aggiornaBadgeMemoria();
  if(typeof render==='function' && typeof TAB!=='undefined') render();
  if(!Sync.attivo && LS_OK===false) mostraCornice();
}

/* --- preparo la pagina per l'icona sulla Home ---
   Safari legge questi tag nel momento in cui tocchi "Aggiungi a Home",
   quindi aggiungerli adesso via codice funziona lo stesso. */
function meta(n,c,prop){ const m=document.createElement('meta');
  m.setAttribute(prop||'name',n); m.content=c; document.head.appendChild(m); }
function preparaHome(){
  try{
    meta('viewport','width=device-width, initial-scale=1, viewport-fit=cover');
    meta('apple-mobile-web-app-capable','yes');
    meta('mobile-web-app-capable','yes');
    meta('apple-mobile-web-app-status-bar-style','black-translucent');
    meta('apple-mobile-web-app-title','You and Fit');
    meta('theme-color','#08080A');
    iconaHome();
    if('serviceWorker' in navigator && location.protocol==='https:'){
      navigator.serviceWorker.register('sw.js').catch(()=>{});
    }
  }catch(e){}
}
/* l'icona: disegno il logo su una tela e la attacco come immagine PNG */
function iconaHome(){
  try{
    const S=180, svg=logoSVG(S).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ');
    const img=new Image();
    img.onload=()=>{
      try{
        const c=document.createElement('canvas'); c.width=c.height=S;
        const x=c.getContext('2d');
        x.fillStyle='#08080A'; x.fillRect(0,0,S,S);
        x.drawImage(img,0,0,S,S);
        const l=document.createElement('link');
        l.rel='apple-touch-icon'; l.setAttribute('sizes','180x180');
        l.href=c.toDataURL('image/png'); document.head.appendChild(l);
        const l2=document.createElement('link');
        l2.rel='icon'; l2.type='image/png'; l2.href=l.href; document.head.appendChild(l2);
      }catch(e){}
    };
    img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
  }catch(e){}
}

/* --- schermata iniziale quando l'app non può salvare dov'è aperta --- */
const INDIRIZZO_VERO = /^https?:$/.test(location.protocol) ? location.href : '';
const DA_FILE = (location.protocol==='file:');
/* l'app gira dentro Claude oppure a casa sua? cambia solo cosa ha senso raccontare */
const DENTRO_CLAUDE = (()=>{ try{ return typeof claude!=='undefined' && !!claude && !!claude.use; }catch(e){ return false; } })();
/* perché questa pagina non può salvare: decide cosa scrivere nella schermata */
function motivoBlocco(){
  if(DA_FILE) return 'file';
  if(DENTRO_CORNICE && INDIRIZZO_VERO) return 'cornice';
  if(DENTRO_CORNICE) return 'anteprima';
  return 'privata';
}

function mostraCornice(){
  const g=document.getElementById('gate'); if(!g) return;
  const caso=motivoBlocco();
  const testa=`<div class="gatelogo">${logoSVG(86)}</div><h1>You and <b>Fit</b></h1>`;
  const salta=`<button class="gateskip" id="gateSkip">Continua lo stesso, solo per guardare</button>`;

  const corpo = caso==='cornice' ? `
      <p>${LS_OK===false

         quindi il telefono non le lascia salvare niente.</p>

        <ol class="passi">

          <li>Poi tocca <b>Apri l'app a tutto schermo</b>.</li>
        </ol>
      </div>`
  : `
      <p>Questo browser non lascia salvare niente all'app${ERR_SALVA?' ('+esc(ERR_SALVA)+')':''}:
         quello che scrivi verrebbe perso.</p>
      <div class="gatesteps">
        <div class="eyebrow">Di solito dipende da una di queste</div>
        <ol class="passi">
          <li>Sei in <b>navigazione privata</b>: esci dalla modalità privata e riapri l'app.</li>
          <li>La memoria del telefono è piena: libera spazio.</li>
          <li>Hai bloccato i dati dei siti nelle impostazioni di Safari.</li>
        </ol>
      </div>`;

  g.hidden=false;
  g.innerHTML=`<div class="gatebox">${testa}${corpo}${salta}</div>`;
  document.getElementById('app').style.display='none';
  const c=document.getElementById('gateCopy'), u=document.getElementById('gateUrl');
  if(c&&u) c.addEventListener('click',async()=>{
    u.select();
    try{ await navigator.clipboard.writeText(u.value); }catch(e){ try{ document.execCommand('copy'); }catch(e2){} }
    c.textContent='Copiato'; setTimeout(()=>{ c.textContent='Copia'; },1800);
  });
  const sk=document.getElementById('gateSkip');
  if(sk) sk.addEventListener('click',()=>{
    g.hidden=true; document.getElementById('app').style.display='';

}

/* --- backup --- */
function backupTesto(){
  return JSON.stringify({app:'youandfit', v:1, quando:new Date().toISOString(), dati:DB});
}
async function copiaBackup(){
  const t=backupTesto();
  try{ await navigator.clipboard.writeText(t); return 'appunti'; }
  catch(e){
    try{
      const b=new Blob([t],{type:'application/json'}), u=URL.createObjectURL(b);
      const a=document.createElement('a');
      a.href=u; a.download='you-and-fit-backup-'+iso(new Date())+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(u),4000);
      return 'file';
    }catch(e2){ return ''; }
  }
}
function applicaBackup(testo){
  let o; try{ o=JSON.parse(testo); }catch(e){ return 'Il testo non è un backup valido'; }
  const d=(o && o.dati) ? o.dati : o;
  if(!d || !d.profilo || !Array.isArray(d.schede)) return 'Questo backup non contiene i dati dell\'app';
  DB=d; save();
  return '';
}

function wkBody(){ const done=new Set(DB.log.map(l=>l.seduteId)); const byWeek={};

/* ===================== ALLENAMENTO GIÀ SVOLTO =====================
   Apre la stessa schermata di esecuzione, ma senza cronometro e senza recuperi:
   i pesi li scrive lui, la data e la durata le decide lui. */
function creaRetro(o){
  const vecchio = o.seduteId ? DB.log.find(l=>l.seduteId===o.seduteId) : null;
  DB.corrente={ seduteId:o.seduteId||null, blocco:o.blocco, retro:true, libero:!!o.libero,
    startTs:Date.now(), pre:0, idx:0,
    dataRetro: (vecchio&&vecchio.data) || o.data || iso(new Date()),
    durataMin: vecchio? Math.round(vecchio.durataSec/60) : '',
    cardio: (vecchio&&vecchio.cardioList)? vecchio.cardioList.slice() : [],
    esercizi: o.ex.map(e=>{
      const v = vecchio && vecchio.esercizi.find(x=>x.nome===e.nome);
      const ser = Array.from({length:e.serie},(_,i)=>{
        const s = v && v.serie[i];
        return s ? {kg:s.kg||'', rip:s.rip||'', done:true} : {kg:'',rip:'',done:false};
      });
      return {nome:e.nome, rep:e.rep, rec:e.rec, note:e.note, noteUser:(v&&v.note)||'', serie:ser};
    }) };
  if(vecchio) DB.log=DB.log.filter(l=>l.id!==vecchio.id);
  Rest.stop();
  save(); STACK=[]; go('exec');
  toast(vecchio?'Correggi i dati e risalva':'Scrivi i pesi che hai usato, poi tocca Cardio e salva');
}
function applySeg(){
  const w=$('#wkSeg'); if(w){ $$('#wkSeg button').forEach(b=>b.setAttribute('aria-selected', b.dataset.seg===SEG.wk)); $('#wkBody').innerHTML=wkBody(); }
  const n=$('#nuSeg'); if(n){ $$('#nuSeg button').forEach(b=>b.setAttribute('aria-selected', b.dataset.seg===SEG.nu)); $('#nuBody').innerHTML=nuBody(); }
}

/* allenamento fuori calendario: scegli scheda, giorno e data */
caricaPassato(){
  const opz=DB.schede.flatMap(s=>s.giorni.map((g,i)=>
    `<option value="${s.id}|${i}">${esc(s.nome)} — ${esc(g.nome)} (${g.esercizi.length} esercizi)</option>`)).join('');
  modal(`<h3>Allenamento già fatto</h3>
    <p class="tiny muted">Lo inserisco nello storico con la data che scegli tu.</p>
    <label class="fld">Scheda e giorno<select id="cpSel">${opz}</select></label>
    <label class="fld">Data<input type="date" id="cpData" value="${iso(new Date())}" max="${iso(new Date())}"></label>
    <div class="row"><button class="btn soft grow" data-act="closeModal">Annulla</button>
    <button class="btn grow" data-act="caricaPassatoGo">Avanti</button></div>`);
},
caricaPassatoGo(){
  const v=($('#cpSel').value||'').split('|'), scId=v[0], gi=+v[1];
  const data=$('#cpData').value||iso(new Date());
  const sc=schedaOf(scId), g=sc&&sc.giorni[gi];
  if(!g || !g.esercizi.length) return toast('Quel giorno non ha esercizi');
  const usate=new Set(DB.log.map(l=>l.seduteId));
  const sd=DB.programma.sedute.find(s=>s.schedaId===scId && s.bloccoIdx===gi && s.data===data && !usate.has(s.id))
        || DB.programma.sedute.find(s=>s.schedaId===scId && s.bloccoIdx===gi && s.data<=data && !usate.has(s.id));
  closeModal();
  creaRetro({ seduteId: sd?sd.id:null, blocco: g.nome, ex: g.esercizi, data, libero: !sd });
},
delLog(t){
  const l=DB.log.find(x=>x.id===t.dataset.id); if(!l) return;
  modal(`<h3>Elimino questo allenamento?</h3>
    <p class="tiny muted">${esc(l.blocco)} · ${fmtData(l.data)} · ${Math.round(l.durataSec/60)} min. Non si recupera.</p>

delLogGo(t){ DB.log=DB.log.filter(x=>x.id!==t.dataset.id); salvaOra(); closeModal(); render(); toast('Allenamento eliminato'); },
compilaSerie(){
  const ex=DB.corrente.esercizi[DB.corrente.idx];
  const primo=ex.serie.find(s=>s.kg);
  ex.serie.forEach(s=>{ s.done=true; if(!s.rip) s.rip=String(ex.rep).split('/')[0];
    if(!s.kg && primo) s.kg=primo.kg; });
  save(); render();
},
toggleSet(t){
  const c=DB.corrente, ex=c.esercizi[c.idx], i=+t.dataset.i, s=ex.serie[i];
  s.done=!s.done;
  if(s.done){ if(!s.rip) s.rip=String(ex.rep).split('/')[0];
    if(IMP().autoRest && !c.retro) Rest.start(ex.rec, prossimaLabel()); }
  save(); render();
},
restQuick(t){ Rest.start(+t.dataset.s, prossimaLabel()); },
addSet(){ const ex=DB.corrente.esercizi[DB.corrente.idx]; ex.serie.push({kg:'',rip:'',done:false}); save(); render(); },
startRest(){ Rest.start(DB.corrente.esercizi[DB.corrente.idx].rec, prossimaLabel()); },
prevEx(){ DB.corrente.idx=Math.max(0,DB.corrente.idx-1); save(); render(); },
nextEx(){ DB.corrente.idx=DB.corrente.idx+1; save(); render(); },
backToEx(){ DB.corrente.idx=DB.corrente.esercizi.length-1; save(); render(); },
goCardio(){ DB.corrente.idx=DB.corrente.esercizi.length; save(); render(); },
cdManuale(){ const k=$('#cdKcal'); if(!k) return;
  k.hidden=false; k.value=calcolaCardio().kcal; k.focus(); toast('Scrivi le calorie che vuoi tenere'); },
cdNote(){ const w=$('#cdIntWrap'); if(w){ w.hidden=false; $('#cdInt').focus(); } },
addCardio(){
  const r=calcolaCardio();
  if(!r.min) return toast('Scrivi quanti minuti hai fatto');
  const k=$('#cdKcal');
  const kcal=(k && !k.hidden && +k.value>0) ? clamp(+k.value,0,3000) : r.kcal;
  DB.corrente.cardio.push({tipo:r.tipo, min:r.min, dett:r.dett,
    intensita:($('#cdInt')?$('#cdInt').value.trim():''), met:+r.met.toFixed(1), kcal});
  save(); render(); toast(`${r.tipo}: ${r.min} min · ${kcal} kcal`);
},
delCardio(t){ DB.corrente.cardio.splice(+t.dataset.i,1); save(); render(); },
finish(){
  const c=DB.corrente;
  if(c.retro && !(+c.durataMin>0)) return toast('Scrivi quanti minuti è durato l\'allenamento');
  const dur = c.retro ? Math.round((+c.durataMin||0)*60) : Math.round((Date.now()-c.startTs)/1000+c.pre);
  const cardioMin=c.cardio.reduce((a,x)=>a+x.min,0);
  const kCardio=c.cardio.reduce((a,x)=>a+x.kcal,0);
  const kPesi=kcalPesi(dur-cardioMin*60);
  const volume=c.esercizi.reduce((a,e)=>a+e.serie.reduce((b,s)=>b+(+s.kg||0)*(+s.rip||0),0),0);
  DB.log.push({ id:uid(), seduteId:c.seduteId, blocco:c.blocco,
    data: c.retro ? (c.dataRetro||iso(new Date())) : iso(new Date()), durataSec:dur,
    kcal:kPesi+kCardio, volume:Math.round(volume),
    cardioList: c.cardio.slice(),
    cardio: c.cardio.length?{tipo:c.cardio.map(x=>x.tipo).join(' + '), min:cardioMin,
      intensita:c.cardio.map(x=>x.intensita).filter(Boolean).join(' · '), kcal:kCardio}:null,
    esercizi:c.esercizi.map(e=>({nome:e.nome, note:e.noteUser, serie:e.serie.filter(s=>s.done||s.kg)})) });
  DB.log.sort((a,b)=>String(a.data).localeCompare(String(b.data)));
  DB.corrente=null; Rest.stop(); wakeOff(); salvaOra(); STACK=[]; setTab('home');
  toast(`Allenamento salvato · ${Math.round(dur/60)} min · ${kPesi+kCardio} kcal`);
},

latoCoach(t){ DB.nutri.latoCoach=t.dataset.l; save(); applySeg(); },

regenMeal(t){
  const n=DB.nutri, pi=+t.dataset.i, d=n.piano.sel, g=n.piano.giorni[d];
  const T=g.target, k=MEALS[pi][0], dist=n.distrib[k];
  g.pasti[pi]=buildMeal(k,[T.c*dist[0],T.p*dist[1],T.f*dist[2]], Math.floor(Math.random()*13)+d+pi);
  g.tot=g.pasti.reduce((a,p)=>({c:a.c+p.tot.c,p:a.p+p.tot.p,f:a.f+p.tot.f}),{c:0,p:0,f:0});
  save(); applySeg();
},
swapFood(t){
  const pi=+t.dataset.p, ii=+t.dataset.i, g=DB.nutri.piano.giorni[DB.nutri.piano.sel];
  const it=g.pasti[pi].items[ii], meal=g.pasti[pi].k;
  const cur=DB.nutri.foods.find(f=>f.id===it.id);
  const opts=DB.nutri.foods.filter(f=>f.pref&&f.m.includes(meal)&&f.t===cur.t);
  modal(`<h3>Cambia alimento</h3><p class="tiny muted">${esc(MEALKEY[meal])} — al posto di ${esc(it.n)}</p>
    <div class="stack">${opts.map(o=>{const d=DOM[o.t]; const base=macroVec(cur)[d]*it.g; const per=macroVec(o)[d];
      const gg=per>0?Math.max(5,Math.round(base/per/5)*5):it.g;
      return `<button class="exrow" data-act="swapDo" data-p="${pi}" data-i="${ii}" data-id="${o.id}" data-g="${gg}">
        <span class="grow"><span class="nm">${esc(o.n)}</span>
          <span class="meta num"><span>${gg} g</span><span>${Math.round(o.k*gg/100)} kcal</span></span></span>
        <span class="arrow">›</span></button>`;}).join('')}</div>
    <button class="btn soft block" data-act="closeModal">Chiudi</button>`);
},
swapDo(t){
  const g=DB.nutri.piano.giorni[DB.nutri.piano.sel], p=g.pasti[+t.dataset.p];
  const f=DB.nutri.foods.find(x=>x.id===t.dataset.id);
  p.items[+t.dataset.i]={...mkItem(f,+t.dataset.g), alt:altList(f,p.k,+t.dataset.g)};
  p.tot=p.items.reduce((a,it)=>({c:Math.round(a.c+it.c),p:Math.round(a.p+it.p),f:Math.round(a.f+it.f)}),{c:0,p:0,f:0});
  g.tot=g.pasti.reduce((a,x)=>({c:a.c+x.tot.c,p:a.p+x.tot.p,f:a.f+x.tot.f}),{c:0,p:0,f:0});

saveObiettivi(){ save(); generaPiano(); SEG.nu='piano'; applySeg(); toast('Obiettivi salvati, piano rigenerato'); },
togglePref(t){ const f=DB.nutri.foods.find(x=>x.id===t.dataset.id); f.pref=!f.pref; save(); applySeg(); },
addFood(){ foodForm(null); },
editFood(t){ foodForm(DB.nutri.foods.find(f=>f.id===t.dataset.id)); },
saveFood(t){
  const id=t.dataset.id;
  const meals=$$('#ffMeals .chip').filter(b=>b.classList.contains('red')).map(b=>b.dataset.m);
  const o={ id:id||('f'+uid()), n:$('#ffN').value.trim()||'Alimento', k:+$('#ffK').value||0,
    c:+$('#ffC').value||0, p:+$('#ffP').value||0, f:+$('#ffF').value||0,
    t:$('#ffT').value, m:meals.length?meals:['PRA'], pref:true };

/* rimette le schede del coach senza toccare storico, foto e impostazioni */
function ripristinaSchedeCoach(forza){
  if(typeof SCHEDE_COACH==='undefined' || !SCHEDE_COACH.length) return 0;
  DB.schede=DB.schede||[];
  let n=0;
  SCHEDE_COACH.forEach((src,i)=>{
    const id='sc'+(i+1);
    const nuova={ id, nome:src.nome, nota:src.nota||'', origine:'Coach',
      giorni:src.giorni.map(g=>({nome:g.nome, esercizi:g.esercizi.map(e=>({
        id:uid(), nome:e.nome, serie:e.serie, rep:e.rep, rec:e.rec||90, note:e.note||''}))})) };
    const k=DB.schede.findIndex(x=>x.id===id);
    if(k<0){ DB.schede.splice(Math.min(i,DB.schede.length),0,nuova); n++; }
    else if(forza || DB.schede[k].origine==='Coach'){ DB.schede[k]=nuova; n++; }
  });
  if(!DB.programma || !DB.schede.find(x=>x.id===DB.programma.schedaId)){
    DB.programma=buildProgramma('sc'+SCHEDE_COACH.length,
      (DB.programma&&DB.programma.inizio)||iso(new Date()),
      (DB.programma&&DB.programma.settimane)||8,
      (DB.programma&&DB.programma.offsets)||[1,3,5,6]);
  }
  return n;
}
function prossimaLabel(){
  const c=DB.corrente; if(!c) return '';
  const ex=c.esercizi[c.idx];
  const n=ex.serie.findIndex(s=>!s.done);
  if(n>=0) return `Poi: serie ${n+1} di ${ex.serie.length} · ${ex.nome}`;
  const dopo=c.esercizi[c.idx+1];
  return dopo ? `Poi: ${dopo.nome}` : 'Poi: parte cardio';
}

/* ===================== INIT ===================== */
DB=load();
if(!DB || !DB.schede){ DB=defaultDB(); generaPiano(); save(); }
if(!DB.impostazioni) DB.impostazioni={suono:true,vibra:true,preavviso:true,autoRest:true};
if(DB.impostazioni.guida===undefined) DB.impostazioni.guida=false;
GUIDA_APERTA=DB.impostazioni.guida;
if(DB.nutri.v!==2){
  // nuovo archivio alimenti + merende piu ricche: conserva le tue scelte per nome
  const vecchi={}; (DB.nutri.foods||[]).forEach(f=>{ vecchi[f.n]=f; });
  const miei=(DB.nutri.foods||[]).filter(f=>!FOODS_BASE.some(b=>b.n===f.n) && String(f.id).length>4);
  DB.nutri.foods=FOODS_BASE.map(b=>({...b, pref: vecchi[b.n]? !!vecchi[b.n].pref : true})).concat(miei);
  DB.nutri.distrib={COL:[.20,.15,.06],SP1:[.14,.15,.06],PRA:[.24,.22,.32],SP2:[.13,.15,.06],CEN:[.21,.23,.36],SP3:[.08,.10,.14]};
  DB.nutri.v=2; DB.nutri.piano=null; save();
}
if(DB.nutri.pianoCoach===undefined) DB.nutri.pianoCoach=PIANI_COACH.length?PIANI_COACH.length-1:0;
if(!DB.impostazioni.audioMode) DB.impostazioni.audioMode='mix';
// le schede del coach non devono mai mancare
if(!DEMO && typeof SCHEDE_COACH!=='undefined' && SCHEDE_COACH.length){
  const presenti=(DB.schede||[]).filter(x=>x.origine==='Coach').length;
  if(presenti<SCHEDE_COACH.length){ ripristinaSchedeCoach(false); save(); }
}
if(DB.vSchede!==4 && typeof SCHEDE_COACH!=='undefined'){
  // aggiornamento compound: via trazioni e dips, dentro gli esercizi ai macchinari
  ripristinaSchedeCoach(false); DB.vSchede=4; save();
}
if(!DB.nutri.piano) generaPiano();
if(DB.corrente){ DB.corrente.pre=(DB.corrente.pre||0)+0; DB.corrente.startTs=Date.now()-((DB.corrente.pre||0)*1000); DB.corrente.pre=0; }
verificaPersistenza();
setTab('home');
preparaHome();
aggiornaBadgeMemoria();
Sync.init();
</script>
